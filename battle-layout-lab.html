<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战斗布局试排</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091714;color:#e5ddbf;font:15px 'Microsoft YaHei',sans-serif}button,select{background:#233d34;color:inherit;border:1px solid #6d7654;border-radius:5px;padding:8px 12px;cursor:pointer}button.active{background:#626040;border-color:#dbc588}.tools{padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tools small{color:#b5c0af}.controls{padding:0 20px 14px;display:flex;gap:22px;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}input{width:125px;accent-color:#c6b275}output{min-width:40px;font-variant-numeric:tabular-nums}#host{margin:0 20px;overflow:auto;border:1px solid #516052;max-height:82vh}#stage{height:780px;min-width:760px;position:relative;overflow:hidden;--cw:128px;--ch:185px;--gap:10px;background:linear-gradient(#35505c 0%,#5b7473 42%,#162e29 58%,#182720 100%)}.island{position:absolute;width:150px;top:39%;left:calc(50% - 75px);opacity:.6}.trees{position:absolute;top:18%;bottom:8%;width:37%;background:url('godot/assets/forest/tree-side.png') bottom/auto 100% repeat-x;filter:brightness(.7)}.left{left:-3%}.right{right:-3%;transform:scaleX(-1)}.floor{position:absolute;inset:56% 0 0;background:url('godot/assets/forest/ground-tile.png') center/260px;clip-path:polygon(48% 0,52% 0,100% 100%,0 100%);filter:brightness(.65)}.haze{position:absolute;inset:40% 32% 35%;background:radial-gradient(ellipse,#10211fd9,transparent 70%)}header{position:absolute;top:12px;left:18px;right:18px;display:flex;align-items:center;justify-content:space-between}header strong{font:26px KaiTi,serif}header small{display:block;font-size:13px;color:#bac3aa;margin-top:4px}.row{display:flex;justify-content:center;gap:var(--gap);position:absolute;left:22px;right:22px}.enemy{top:66px}.friendly{bottom:55px}.card{flex:0 0 var(--cw);width:var(--cw);height:var(--ch);border:1px solid #a28b53;background:linear-gradient(145deg,#273b2af5,#0b1715fa);border-radius:7px;display:flex;align-items:center;flex-direction:column;padding:7px;box-shadow:0 4px 12px #0008;position:relative;cursor:pointer}.card:hover{outline:2px solid #d7d8a0;transform:translateY(-5px)}.card.selected{outline:2px solid #e4c97f}.card img{width:100%;min-height:0;flex:1;object-fit:contain;padding:3px}.card b{font:19px KaiTi,serif;white-space:nowrap}.tag{font-size:11px;color:#c6c9aa}.stats{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:5px;font-size:12px}.hp{border:2px solid #b39a57;background:radial-gradient(circle at 35% 25%,#a54c39,#53251e);border-radius:50%;width:33px;height:33px;display:grid;place-items:center;font:16px Georgia;color:#fff0d8}.cool{position:absolute;bottom:0;left:8px;right:8px;height:3px;background:#809786}.cool:after{content:'';display:block;background:#e5ce79;width:58%;height:100%}footer{position:absolute;bottom:12px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.formation-tag{position:absolute;left:22px;bottom:calc(65px + var(--ch));font-size:13px;color:#d6d4b4}.enemy .card{height:calc(var(--ch)*.87)}.modeC .friendly .card:not(.hero){height:calc(var(--ch)*.81);align-self:flex-end}.modeC .hero{width:calc(var(--cw)*1.2);flex-basis:calc(var(--cw)*1.2)}.modeA .card{display:grid;grid-template-columns:44% 56%;grid-template-rows:24px 1fr 36px}.modeA .card img{grid-column:1;grid-row:1/4;height:100%}.modeA .card b,.modeA .card .tag,.modeA .card .stats{grid-column:2;text-align:center}.modeA .card b{font-size:17px}.modeA .tag{align-self:center}.modeA .stats{margin:0;gap:4px}.hint{padding:12px 20px;line-height:1.7;color:#b6c2b6}#measure{position:absolute;left:18px;top:calc(88px + var(--ch));font-size:12px;padding:6px;background:#0c211ac9}.overflow{color:#ffb49a!important}#detail{position:absolute;left:18px;top:46%;background:#10281eef;padding:12px;border-left:2px solid #b4a06a;max-width:210px;display:none}

/* Original-demo invariant: liquid health orb inside the circular cooldown ring. */
.orbit{width:46px;height:46px;flex:none;border-radius:50%;padding:4px;background:conic-gradient(from -90deg,#e2c77c 0deg 210deg,#344b44 210deg 360deg);box-shadow:0 0 0 1px #8d794b;position:relative}
.orb{height:100%;width:100%;position:relative;overflow:hidden;border:1px solid #b9a774;border-radius:50%;background:#241e1c;box-shadow:inset 0 0 6px #000b;display:grid;place-items:center}
.blood{position:absolute;bottom:0;left:0;right:0;height:var(--fill,70%);background:radial-gradient(ellipse at 35% 15%,#d27052,#923c30 55%,#58251e)}
.blood:before{content:'';position:absolute;left:-10%;top:-3px;width:120%;height:7px;border-radius:50%;background:#cd765a99}
.orb em{position:relative;z-index:1;font:16px Georgia,serif;color:#fff1d3;text-shadow:0 1px 3px #000;font-style:normal}
.orb:after{content:'';position:absolute;inset:2px;border-radius:50%;background:radial-gradient(ellipse at 28% 20%,#fff5 0,transparent 38%);pointer-events:none}
.orbit.held{background:#7f6c40}.held .orb{background:#473b24}.held .blood{display:none}
.stats{min-height:46px;flex:none}.modeA .card{grid-template-rows:22px 1fr 46px}.modeA .stats{grid-row:3}.modeA .tag{grid-row:2}.modeA .card b{grid-row:1}
.hide-names .card b{display:none}.hide-names.modeA .card .tag{grid-row:1/3}.controls input[type=checkbox]{width:auto;accent-color:#c6b275}
</style>
<div class="tools"><strong>战斗布局试排</strong><a href="card-design-lab.html" style="color:#d8c68c">卡牌设计台 ↗</a><button data-mode="A">A · 矮宽卡</button><button data-mode="B">B · 均衡卡</button><button data-mode="C">C · 主次卡</button><select id="width"><option value="100%">跟随窗口</option><option>1000</option><option>1280</option><option>1600</option><option>1920</option></select><button id="reset">重置本版</button><small>真实资产＋网页排版，无生图；仅验证布局，不模拟战斗。</small></div>
<div class="controls"><label>卡宽<input id="cw" type="range" min="85" max="200"><output id="cwO"></output></label><label>卡高<input id="ch" type="range" min="100" max="280"><output id="chO"></output></label><label>间距<input id="gap" type="range" min="2" max="24"><output id="gapO"></output></label><label>画面高<input id="height" type="range" min="600" max="1080" value="780"><output id="heightO"></output></label><label><input id="showNames" type="checkbox" checked>显示卡牌名</label><button id="enemies">敌阵：显示</button></div>
<div id="host"><main id="stage"><img class="island" src="godot/assets/world/sky/island_far_1.png"><div class="trees left"></div><div class="trees right"></div><div class="floor"></div><div class="haze"></div><header><div><strong>林间小径</strong><small>交锋中 · 第一次遭遇</small></div><div>行囊 · 20 灵石　<button>归途</button></div></header><section class="row enemy" id="enemy"></section><div id="measure"></div><div id="detail"></div><span class="formation-tag">随行阵容 · 8 / 10</span><section class="row friendly" id="friendly"></section><footer><span>点击卡牌查看占位信息</span><span>暂歇　｜　行速：一倍</span></footer></main></div>
<div class="hint" id="note"></div>
<script>
const $=id=>document.getElementById(id),root='godot/assets/cleaned/';
const friend=[['瓦甓印','artifact-waci-yin',74,'操控'],['麻索','artifact-masuo',49,'操控'],['道童','char-daotong',96,'角色'],['桃木剑','artifact-taomu-jian',0,'手持'],['铜镜','artifact-tongjing',46,'操控'],['小葫芦','artifact-xiaohulu',56,'操控'],['飞剑','artifact-taomu-jian',35,'操控'],['离火术',null,0,'术法']];
function card(data){let [name,file,hp,mode]=data;let e=document.createElement('article');e.className='card'+(mode==='角色'?' hero':'');e.title=name+' · '+mode;e.setAttribute('aria-label',name+' · '+mode);e.innerHTML=(file?`<img src="${root}style-e-${file}.png" alt="${name}">`:'<img src="godot/assets/style-e/style-e-monster-huoli.png" alt="术法临时图标">')+`<b>${name}</b><span class="tag">7级 · ${mode}</span><div class="stats"><span class="orbit ${hp?'':'held'}" title="${hp?'血球显示血量；外环显示冷却进度（示意）':mode}" aria-label="${hp?'血量 '+hp+'，冷却进度 58%':mode}"><span class="orb"><i class="blood" style="--fill:${hp?65+hp%25:0}%"></i><em>${hp||(mode==='术法'?'识':'持')}</em></span></span></div>`;e.onclick=()=>{document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');$('detail').style.display='block';$('detail').textContent=name+' · '+mode+'｜此区域预留卡牌详情，不挤压下方阵列。'};return e}
friend.forEach(d=>$('friendly').append(card(d)));[['火狸','monster-huoli',28,'敌方'],['草蛇','monster-caoshe',32,'敌方'],['野乌','monster-yewu',24,'敌方']].forEach(d=>$('enemy').append(card(d)));
const presets={A:[145,125,8,'矮宽卡：图像在左、信息在右。优先释放纵向景观；注意八张并排需要的横向宽度。'],B:[126,200,10,'均衡卡：图像、名字、状态纵向排列。比较阅读密度与场景留白。'],C:[115,240,10,'主次卡：角色保持较大完整卡，法宝与术法缩短。检查角色是否突出，以及底边是否整齐。']};let mode='B';function apply(){$('stage').classList.toggle('hide-names',!$('showNames').checked);localStorage.setItem('battle-layout-show-names',String($('showNames').checked));for(let id of ['cw','ch','gap']){$('stage').style.setProperty('--'+id,$(id).value+'px');$(id+'O').textContent=$(id).value+'px'}$('stage').style.height=$('height').value+'px';$('heightO').textContent=$('height').value+'px';let width=$('friendly').scrollWidth,available=$('friendly').clientWidth;let over=width>available+2;$('measure').textContent=over?'当前阵列超出可用宽度，请减小卡宽或间距':'阵列宽度可容纳 · 中央区域可留给景观与特效';$('measure').className=over?'overflow':''}
function setMode(m){mode=m;$('stage').className='mode'+m;['cw','ch','gap'].forEach((id,i)=>$(id).value=presets[m][i]);$('note').textContent=presets[m][3]+' 所有血量与冷却均为固定占位值；飞剑与术法临时借用现有图标。';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));apply()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelectorAll('input').forEach(i=>i.oninput=apply);$('reset').onclick=()=>setMode(mode);$('width').onchange=()=>{$('stage').style.width=$('width').value==='100%'?'100%':$('width').value+'px';apply()};$('enemies').onclick=()=>{let hide=$('enemy').style.display!=='none';$('enemy').style.display=hide?'none':'flex';$('enemies').textContent='敌阵：'+(hide?'隐藏':'显示')};window.onresize=apply;$('showNames').checked=localStorage.getItem('battle-layout-show-names')!=='false';setMode('B');
</script></html>
