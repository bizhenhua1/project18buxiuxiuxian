<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡牌设计台</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#101c19;color:#e2dec9;font:14px 'Microsoft YaHei',sans-serif}header{padding:16px 22px;border-bottom:1px solid #425148;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}a{color:#d2c28c}button,select,input[type=text]{color:inherit;background:#24372f;border:1px solid #65745b;border-radius:5px;padding:7px}button{cursor:pointer}button:hover{border-color:#e0c47b}.layout{display:grid;grid-template-columns:350px 1fr;height:calc(100vh - 77px)}aside{overflow:auto;padding:12px 18px 40px;border-right:1px solid #425148}details{border-bottom:1px solid #394b40;padding:12px 0}summary{cursor:pointer;font-size:16px;color:#d9c995;margin-bottom:10px}.field{display:grid;grid-template-columns:112px 1fr 52px;gap:7px;align-items:center;margin:9px 0}.field input[type=range]{width:100%;accent-color:#c9b376}.field input[type=number]{width:52px;background:#182b23;border:1px solid #506252;color:inherit;padding:3px}.field select,.field input[type=text]{grid-column:2/4;min-width:0}.field input[type=checkbox]{justify-self:start;accent-color:#c9b376}.field input[type=color]{width:50px;height:27px;padding:0;border:0}.preview{overflow:auto;padding:24px;position:relative;background:radial-gradient(ellipse at 50% 35%,#345043,#101c19)}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.boards{display:flex;align-items:flex-start;justify-content:center;gap:36px;flex-wrap:wrap}.board{text-align:center}.board>small{display:block;color:#b1bcad;margin:10px}.canvas{line-height:0;background:repeating-conic-gradient(#26362e 0% 25%,#2d4037 0% 50%) 0/22px 22px;border:1px solid #4c6353}.canvas svg{max-width:100%;height:auto}#status{min-height:22px;color:#dcca91;margin:12px 0}p{line-height:1.7;color:#b8c6b8}.buttons{display:flex;gap:6px;flex-wrap:wrap}#upload{max-width:100%;margin:8px 0}#parameters{max-height:130px;overflow:auto;white-space:pre-wrap;font-size:11px;color:#94a799} @media(max-width:800px){.layout{grid-template-columns:290px 1fr}aside{padding:10px}.field{grid-template-columns:95px 1fr 48px}.preview{padding:12px}}
</style>
<header><h1>卡牌设计台</h1><a href="battle-layout-lab.html">返回战斗布局</a><span>立绘、血球、冷却环独立排版 · SVG 实时渲染</span></header>
<div class="layout"><aside id="controls"></aside><section class="preview"><div class="bar"><label>预览倍率 <select id="zoom"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label><button id="guides">辅助线：开</button><button id="save">保存设计</button><button id="load">读取保存</button><button id="reset">重置</button></div><div class="boards"><div class="board"><small>放大编辑预览</small><div class="canvas" id="large"></div></div><div class="board"><small>实际像素尺寸 · 不含辅助线</small><div class="canvas" id="actual"></div></div></div><div id="status" role="status"></div><div class="buttons"><button id="json">导出参数 JSON</button><button id="svg">导出透明 SVG</button><button id="png">导出透明 PNG</button><button id="import">导入参数</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p>位置以卡面左上角为基准，X / Y 为卡宽、卡高百分比。血球与外环尺寸以像素计，互不绑定。隐藏名字不会改变卡片尺寸。渐隐只影响立绘，不影响文字、血球和外环。导出包含完整效果，不含棋盘背景和辅助线。</p><pre id="parameters"></pre></section></div>
<script>
const $=id=>document.getElementById(id), assets='godot/assets/cleaned/';
const defaults={w:180,h:260,round:9,border:1,bg:'#142820',frame:'#ad9459',name:'道童',showName:true,nameX:50,nameY:71,nameSize:20,art:'style-e-char-daotong.png',artX:50,artY:35,artW:90,artH:66,artScale:100,artShiftX:0,artShiftY:0,mask:'round',maskRound:10,clipCard:true,fade:true,fadeStart:65,fadeEnd:100,artOpacity:100,showOrb:true,orbX:50,orbY:86,orbSize:42,health:74,maxHealth:100,blood:'#a64332',showNumber:true,showRing:true,ringX:50,ringY:86,ringSize:52,ringWidth:3,progress:62,ringStart:-90,ringColor:'#d9c177',ringTrack:'#41594c',ringOver:true};
let s={...defaults},guide=true,artData='',artAspect=1,uploadData='',revision=0;
const groups=[['卡面与名称',[['w','卡宽',90,360],['h','卡高',100,480],['round','圆角',0,40],['border','边框宽',0,6],['bg','底色','color'],['frame','边框色','color'],['showName','显示卡牌名','check'],['name','卡牌名称','text'],['nameX','名字 X %',0,100],['nameY','名字 Y %',0,100],['nameSize','字号',10,40]]],['立绘与遮罩',[['art','选择立绘','select',{'style-e-char-daotong.png':'道童','style-e-artifact-waci-yin.png':'瓦甓印','style-e-artifact-masuo.png':'麻索','style-e-artifact-tongjing.png':'铜镜','style-e-artifact-xiaohulu.png':'小葫芦','style-e-monster-huoli.png':'火狸','style-e-monster-caoshe.png':'草蛇'}],['artX','遮罩中心 X %',-30,130],['artY','遮罩中心 Y %',-30,130],['artW','遮罩宽 %',10,160],['artH','遮罩高 %',10,160],['artScale','立绘缩放 %',30,250],['artShiftX','立绘偏移 X %',-100,100],['artShiftY','立绘偏移 Y %',-100,100],['mask','遮罩形状','select',{none:'无遮罩',rect:'矩形',round:'圆角矩形',ellipse:'椭圆'}],['maskRound','遮罩圆角',0,80],['clipCard','裁到卡面以内','check'],['artOpacity','立绘不透明 %',0,100]]],['立绘底部渐隐',[['fade','开启底部渐隐','check'],['fadeStart','渐隐起点 %',0,99],['fadeEnd','渐隐终点 %',1,100]]],['圆形血球',[['showOrb','显示血球','check'],['orbX','血球 X %',-20,120],['orbY','血球 Y %',-20,120],['orbSize','血球直径 px',16,130],['health','当前血量',0,200],['maxHealth','最大血量',1,200],['blood','血液颜色','color'],['showNumber','显示血量数字','check']]],['圆形进度条',[['showRing','显示进度环','check'],['ringX','进度环 X %',-20,120],['ringY','进度环 Y %',-20,120],['ringSize','环外径 px',20,160],['ringWidth','环粗细 px',1,12],['progress','进度 %',0,100],['ringStart','起点角度',-180,180],['ringColor','进度颜色','color'],['ringTrack','底环颜色','color'],['ringOver','进度环在血球上层','check']]]];
function fields(){ $('controls').innerHTML='';for(const [title,items] of groups){const d=document.createElement('details');d.open=true;const sum=document.createElement('summary');sum.textContent=title;d.append(sum);for(const f of items){const [key,label,type,max]=f,row=document.createElement('label');row.className='field';const text=document.createElement('span');text.textContent=label;row.append(text);let input;if(type==='select'){input=document.createElement('select');for(const [v,t] of Object.entries(max)){input.add(new Option(t,v))}}else{input=document.createElement('input');input.type=typeof type==='number'?'range':type==='check'?'checkbox':type;if(typeof type==='number'){input.min=type;input.max=max;input.step=1}}input.dataset.key=key;input.id=key;row.append(input);if(typeof type==='number'){const n=document.createElement('input');n.type='number';n.min=type;n.max=max;n.dataset.number=key;n.setAttribute('aria-label',label+'数值');n.oninput=()=>{if(!Number.isFinite(n.valueAsNumber))return;s[key]=Math.max(type,Math.min(max,n.valueAsNumber));update();};row.append(n)}input.oninput=()=>{s[key]=type==='check'?input.checked:typeof type==='number'?+input.value:input.value;if(key==='art'){uploadData='';loadArt()}else update()};d.append(row)}if(title==='立绘与遮罩'){const l=document.createElement('label');l.textContent='或上传本地透明立绘（仅在本机处理）';const u=document.createElement('input');u.id='upload';u.type='file';u.accept='image/png,image/webp,image/jpeg';u.onchange=async()=>{const file=u.files[0];if(!file)return;if(file.size>3000000){message('请选 3 MB 以内的图片。');return}uploadData=await dataURL(file);await loadArt();};d.append(l,u)}$('controls').append(d)}}
function sync(){for(const input of document.querySelectorAll('[data-key]')){const v=s[input.dataset.key];if(input.type==='checkbox')input.checked=v;else input.value=v}for(const n of document.querySelectorAll('[data-number]'))n.value=s[n.dataset.number]}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function geometry(){const x=s.w*s.artX/100,y=s.h*s.artY/100,bw=s.w*s.artW/100,bh=s.h*s.artH/100,cx=s.w*s.orbX/100,cy=s.h*s.orbY/100,rx=s.w*s.ringX/100,ry=s.h*s.ringY/100;const iw=Math.min(bw,bh*artAspect)*s.artScale/100,ih=iw/artAspect;return{x,y,bw,bh,cx,cy,rx,ry,iw,ih}}
function frame(){const g=geometry();let left=-6,top=-6,right=s.w+6,bottom=s.h+6;const add=(x,y,w,h)=>{left=Math.min(left,x-6);top=Math.min(top,y-6);right=Math.max(right,x+w+6);bottom=Math.max(bottom,y+h+6)};if(!s.clipCard){if(s.mask==='none')add(g.x-g.iw/2+s.artShiftX*g.bw/100,g.y-g.ih/2+s.artShiftY*g.bh/100,g.iw,g.ih);else add(g.x-g.bw/2,g.y-g.bh/2,g.bw,g.bh)}if(s.showOrb)add(g.cx-s.orbSize/2,g.cy-s.orbSize/2,s.orbSize,s.orbSize);if(s.showRing)add(g.rx-s.ringSize/2,g.ry-s.ringSize/2,s.ringSize,s.ringSize);if(s.showName){const width=s.name.length*s.nameSize;add(s.w*s.nameX/100-width/2,s.h*s.nameY/100-s.nameSize/2,width,s.nameSize)}return{x:left,y:top,w:right-left,h:bottom-top}}
function svgMarkup(guides=false){const g=geometry(),{x,y,bw,bh,cx,cy,rx,ry,iw,ih}=g,ox=x-iw/2+s.artShiftX*bw/100,oy=y-ih/2+s.artShiftY*bh/100,r=s.orbSize/2,rr=(s.ringSize-s.ringWidth)/2,rate=Math.min(1,s.health/s.maxHealth),fy=cy+r-s.orbSize*rate,fs=Math.min(s.fadeStart,s.fadeEnd-1),fe=Math.max(s.fadeEnd,fs+1);const artClip=s.mask==='ellipse'?`<ellipse cx="${x}" cy="${y}" rx="${bw/2}" ry="${bh/2}"/>`:`<rect x="${x-bw/2}" y="${y-bh/2}" width="${bw}" height="${bh}" rx="${s.mask==='round'?s.maskRound:0}"/>`;
const orb=s.showOrb?`<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#251e1b" stroke="${s.frame}" stroke-width="1.5"/><g clip-path="url(#orbClip)"><rect x="${cx-r}" y="${fy}" width="${s.orbSize}" height="${s.orbSize*rate}" fill="url(#bloodFill)"/>${rate>0&&rate<1?`<ellipse cx="${cx}" cy="${fy}" rx="${r}" ry="${s.orbSize*.055}" fill="#eeb394" opacity=".35"/>`:''}<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#shine)"/></g>${s.showNumber?`<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" fill="#fff0d4" font-size="${s.orbSize*.39}" font-family="Georgia,serif">${s.health}</text>`:''}</g>`:'';
const ring=s.showRing?`<g transform="rotate(${s.ringStart} ${rx} ${ry})"><circle cx="${rx}" cy="${ry}" r="${rr}" fill="none" stroke="${s.ringTrack}" stroke-width="${s.ringWidth}"/><circle cx="${rx}" cy="${ry}" r="${rr}" fill="none" stroke="${s.ringColor}" stroke-width="${s.ringWidth}" pathLength="100" stroke-dasharray="${s.progress} ${100-s.progress}"/></g>`:'';
// Padding keeps independently positioned elements inspectable and exportable.
const bounds=frame();return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(bounds.w)}" height="${Math.ceil(bounds.h)}" viewBox="${bounds.x} ${bounds.y} ${bounds.w} ${bounds.h}"><defs><clipPath id="cardClip"><rect width="${s.w}" height="${s.h}" rx="${s.round}"/></clipPath><clipPath id="artClip">${artClip}</clipPath><clipPath id="orbClip"><circle cx="${cx}" cy="${cy}" r="${r-1}"/></clipPath><linearGradient id="portraitFade" x1="0" y1="0" x2="0" y2="1"><stop offset="${fs}%" stop-color="white"/><stop offset="${fe}%" stop-color="black"/></linearGradient><mask id="fadeMask" maskUnits="userSpaceOnUse" x="${x-bw*3}" y="${y-bh*3}" width="${bw*6}" height="${bh*6}"><rect x="${x-bw*3}" y="${y-bh*3}" width="${bw*6}" height="${bh*3-bh/2}" fill="white"/><rect x="${x-bw*3}" y="${y-bh/2}" width="${bw*6}" height="${bh}" fill="url(#portraitFade)"/></mask><linearGradient id="bloodFill" x2="0" y2="1"><stop stop-color="${s.blood}"/><stop offset="1" stop-color="#431914"/></linearGradient><radialGradient id="shine" cx=".28" cy=".22" r=".8"><stop stop-color="white" stop-opacity=".38"/><stop offset=".45" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="black" stop-opacity=".3"/></radialGradient></defs><rect width="${s.w}" height="${s.h}" rx="${s.round}" fill="${s.bg}" stroke="${s.frame}" stroke-width="${s.border}"/><g ${s.clipCard?'clip-path="url(#cardClip)"':''}><g ${s.mask!=='none'?'clip-path="url(#artClip)"':''}><g ${s.fade?'mask="url(#fadeMask)"':''} opacity="${s.artOpacity/100}"><image href="${artData}" x="${ox}" y="${oy}" width="${iw}" height="${ih}"/></g></g></g>${s.showName?`<text x="${s.w*s.nameX/100}" y="${s.h*s.nameY/100}" text-anchor="middle" dominant-baseline="central" fill="#dfd0a2" font-family="KaiTi,serif" font-size="${s.nameSize}">${esc(s.name)}</text>`:''}${s.ringOver?orb+ring:ring+orb}${guides?`<rect x="${x-bw/2}" y="${y-bh/2}" width="${bw}" height="${bh}" fill="none" stroke="#80d6c0" stroke-dasharray="4 3"/><path d="M${cx-6},${cy}h12 M${cx},${cy-6}v12" stroke="#f29999"/><path d="M${rx-6},${ry}h12 M${rx},${ry-6}v12" stroke="#f1d476"/><path d="M0,${s.h/2}h${s.w} M${s.w/2},0v${s.h}" stroke="#ffffff25" stroke-dasharray="3 4"/>`:''}</svg>`}
function update(){sync();const markup=svgMarkup(guide);$('large').innerHTML=markup;$('actual').innerHTML=svgMarkup(false);const zoom=+$('zoom').value;for(const [id,z] of [['large',zoom],['actual',1]]){const svg=$(id).firstElementChild;const bounds=frame();svg.setAttribute('width',bounds.w*z);svg.setAttribute('height',bounds.h*z)}$('parameters').textContent=JSON.stringify({card:[s.w,s.h],portraitMask:s.mask,fade:s.fade,orb:[s.orbX,s.orbY,s.orbSize],ring:[s.ringX,s.ringY,s.ringSize,s.ringWidth],showName:s.showName},null,2);}
function message(t){$('status').textContent=t}function dataURL(blob){return new Promise((resolve,reject)=>{const f=new FileReader();f.onload=()=>resolve(f.result);f.onerror=reject;f.readAsDataURL(blob)})}
async function loadArt(){const id=++revision;try{const url=uploadData||assets+s.art;const data=uploadData||await dataURL(await (await fetch(url)).blob());const img=new Image();img.src=data;await img.decode();if(id!==revision)return;artData=data;artAspect=img.naturalWidth/img.naturalHeight;update();message('预览已更新。')}catch(e){message('立绘加载失败，请切换图片或重新上传。')}}
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bundle(){return{schema:1,kind:'card-design-lab',settings:s,uploadedArt:uploadData||undefined}}function restore(value){if(value.schema!==1||value.kind!=='card-design-lab'||!value.settings)throw Error('不是有效的卡牌设计参数');const next={...defaults};for(const [,items]of groups)for(const [key,,type,max]of items){const v=value.settings[key];if(typeof type==='number'&&Number.isFinite(v))next[key]=Math.max(type,Math.min(max,v));else if(type==='check'&&typeof v==='boolean')next[key]=v;else if(type==='color'&&/^#[0-9a-f]{6}$/i.test(v))next[key]=v;else if(type==='select'&&Object.hasOwn(max,v))next[key]=v;else if(type==='text'&&typeof v==='string')next[key]=v.slice(0,40)}s=next;uploadData=typeof value.uploadedArt==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(value.uploadedArt)?value.uploadedArt:'';loadArt()}
$('zoom').onchange=update;$('guides').onclick=()=>{guide=!guide;$('guides').textContent='辅助线：'+(guide?'开':'关');update()};$('save').onclick=()=>{try{localStorage.setItem('card-design-v1',JSON.stringify(bundle()));message('已保存到当前浏览器；也可导出 JSON 留档。')}catch(e){message('浏览器存储不足，请导出 JSON 保存。')}};$('load').onclick=()=>{try{restore(JSON.parse(localStorage.getItem('card-design-v1')))}catch(e){message('尚无可读取的设计。')}};$('reset').onclick=()=>{s={...defaults};uploadData='';loadArt()};$('json').onclick=()=>download(new Blob([JSON.stringify(bundle(),null,2)],{type:'application/json'}),'card-design.json');$('svg').onclick=()=>download(new Blob([svgMarkup(false)],{type:'image/svg+xml'}),'card-design.svg');$('png').onclick=async()=>{try{const blob=new Blob([svgMarkup(false)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>download(b,'card-design.png'))}catch(e){message('PNG 导出失败，可先导出 SVG。')}};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async()=>{try{const file=$('importFile').files[0];if(file)restore(JSON.parse(await file.text()))}catch(e){message('参数文件无法读取。')}};fields();loadArt();
</script></html>
