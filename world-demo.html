<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>世界地块拼装预览 · 云海浮空岛</title>
  <style>
    :root { --bg: #2a241c; --ink: #f3e6c8; --muted: #b8a888; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Microsoft YaHei", sans-serif; }
    header { padding: 12px 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #231e18; }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    button { background: #3a2f22; color: var(--ink); border: 1px solid #6a5438; padding: 4px 10px; cursor: pointer; }
    button:hover { background: #4a3c2c; }
    #stage { width: 100%; height: calc(100vh - 56px); display: block; background: #2a241c; }
    .hint { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>云海浮空岛 · 森林区域</h1>
    <button type="button" id="reroll">重掷一屏</button>
    <span class="hint">未开格是阴影预览 · 点闪雾格子会走过去开图 · 左右方向键或 A/D 旋转岛屿</span>
  </header>
  <canvas id="stage"></canvas>
  <script type="module">
    import {
      createFog, cellKey, computeSight, levelOf, remember,
      visionRadius, isAdjacentToSet, fogStyle,
    } from "./js/world-fog.js?v=world36";

    const TILE_W = 112;
    const LAND = [
      "assets/world/forest/base/grass_1.png",
      "assets/world/forest/base/grass_2.png",
      "assets/world/forest/base/leaf_1.png",
    ];
    const ROCK = "assets/world/forest/base/rock_1.png";
    const WATER = "assets/world/forest/base/water_1.png";
    const FEATURES = [
      { src: "assets/world/forest/feature/giant_tree_1.png", w: 0.95, kind: "event" },
      { src: "assets/world/forest/feature/cave_1.png", w: 0.88, kind: "cave" },
      { src: "assets/world/forest/feature/grove_1.png", w: 0.72, kind: "forest" },
      { src: "assets/world/forest/feature/rockpile_1.png", w: 0.48, kind: "deco" },
      { src: "assets/world/forest/feature/flower_1.png", w: 0.42, kind: "deco" },
      { src: "assets/world/forest/feature/shrub_1.png", w: 0.48, kind: "deco" },
    ];
    const MTN = {
      peak: { src: "assets/world/forest/feature/mountain_1.png", w: 0.92 },
      mid: { src: "assets/world/forest/link/mountain_mid.png", w: 1.05 },
      endL: { src: "assets/world/forest/link/mountain_end_l.png", w: 0.9 },
      endR: { src: "assets/world/forest/link/mountain_end_r.png", w: 0.9 },
    };
    const SHROUD = "assets/world/sky/shroud_base.png";
    const HERO = "assets/style-e/style-e-char-daotong.png";
    const HERO_H = 64;
    const STEP_MS = 360;
    const SPIN_MS = 300;
    const SLAB = 0.88;
    const XRAY_TOP = "rgba(255, 226, 122, 0.16)";
    const XRAY_SIDE_A = "rgba(240, 196, 76, 0.13)";
    const XRAY_SIDE_B = "rgba(212, 160, 48, 0.12)";
    const XRAY_STROKE_OK = "rgba(92, 214, 126, 0.96)";
    const XRAY_STROKE_NO = "rgba(230, 86, 78, 0.96)";
    const THEME = { land: () => pick(LAND), water: true, ridge: true, feat: 0.16 };

    const load = (src) => new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(src);
      im.src = src + "?v=world23";
    });
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];
    const key = (c, r) => `${c},${r}`;

    /* 资产角度不严格，格距按 2:1。所有地台锁同一落格尺寸，避免按原图比例各拉各的。 */
    const FACE_H_RATIO = 0.5;
    const REF_ASPECT = 320 / 420;
    const REF_EQ = 129 / 320;
    const TILE_H = TILE_W * FACE_H_RATIO;
    const DRAW_SCALE = 1.06;
    /* 台阶低于地台自身厚度，高格沉进低格，侧面互相遮挡。 */
    const STEP = 22;

    function measure(img) {
      const c = document.createElement("canvas");
      c.width = img.width;
      c.height = img.height;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.drawImage(img, 0, 0);
      const data = g.getImageData(0, 0, c.width, c.height).data;
      let minX = img.width;
      let maxX = 0;
      let minY = img.height;
      let maxY = 0;
      let maxSpan = 0;
      let eqY = img.height * REF_EQ;
      for (let y = 0; y < img.height; y += 2) {
        let lo = img.width;
        let hi = -1;
        const row = y * img.width;
        for (let x = 0; x < img.width; x++) {
          if (data[(row + x) * 4 + 3] > 10) {
            if (x < lo) lo = x;
            if (x > hi) hi = x;
          }
        }
        if (hi >= 0) {
          if (lo < minX) minX = lo;
          if (hi > maxX) maxX = hi;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          if (hi - lo > maxSpan) {
            maxSpan = hi - lo;
            eqY = y;
          }
        }
      }
      return {
        contentW: Math.max(1, maxX - minX + 1),
        contentH: Math.max(1, maxY - minY + 1),
        eqY,
      };
    }

    const NBS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    function walkPrefer(len, cols, rows, avoid, scoreFn) {
      const seeds = [];
      for (let r = 1; r < rows - 1; r++) {
        for (let c = 1; c < cols - 1; c++) {
          if (avoid.has(key(c, r))) continue;
          seeds.push({ c, r, s: scoreFn(c, r) });
        }
      }
      if (!seeds.length) return [];
      seeds.sort((a, b) => b.s - a.s);
      const top = seeds.filter((p) => p.s === seeds[0].s);
      let { c, r } = pick(top);
      const path = [{ c, r }];
      const used = new Set([key(c, r)]);
      for (let i = 1; i < len; i++) {
        const opts = NBS
          .map(([dc, dr]) => ({ c: c + dc, r: r + dr }))
          .filter((p) => p.c >= 0 && p.r >= 0 && p.c < cols && p.r < rows)
          .filter((p) => !used.has(key(p.c, p.r)) && !avoid.has(key(p.c, p.r)));
        if (!opts.length) break;
        const best = Math.max(...opts.map((p) => scoreFn(p.c, p.r)));
        const next = pick(opts.filter((p) => scoreFn(p.c, p.r) === best));
        path.push(next);
        used.add(key(next.c, next.r));
        c = next.c;
        r = next.r;
      }
      return path;
    }

    function expandBlob(start, extra, cols, rows, avoid, allowFn) {
      const out = [...start];
      const used = new Set(start.map((p) => key(p.c, p.r)));
      for (let n = 0; n < extra; n++) {
        const opts = out.flatMap((p) => NBS.map(([dc, dr]) => ({ c: p.c + dc, r: p.r + dr })))
          .filter((p) => p.c >= 0 && p.r >= 0 && p.c < cols && p.r < rows)
          .filter((p) => !used.has(key(p.c, p.r)) && !avoid.has(key(p.c, p.r)))
          .filter((p) => !allowFn || allowFn(p.c, p.r));
        if (!opts.length) break;
        const add = pick(opts);
        out.push(add);
        used.add(key(add.c, add.r));
      }
      return out;
    }

    function fitGrid(cw, ch) {
      const cols = Math.max(18, Math.round(cw / TILE_W) + 8);
      const rows = Math.max(16, Math.round(ch / TILE_H) + 8);
      return { cols, rows };
    }

    /* 填满曼哈顿菱形，四邻全连，再沿边长出几格，保证一座岛是一块。 */
    function filledDiamond(cols, rows, seed, radius) {
      const cells = [];
      for (let r = 1; r < rows - 1; r++) {
        for (let c = 1; c < cols - 1; c++) {
          if (Math.abs(c - seed.c) + Math.abs(r - seed.r) <= radius) {
            cells.push({ c, r });
          }
        }
      }
      return cells;
    }

    function growConnectedRim(cells, cols, rows, extra) {
      const used = new Set(cells.map((p) => key(p.c, p.r)));
      const out = cells.slice();
      for (let n = 0; n < extra; n++) {
        const opts = [];
        const seen = new Set();
        for (const p of out) {
          for (const [dc, dr] of NBS) {
            const c = p.c + dc;
            const r = p.r + dr;
            const k = key(c, r);
            if (c < 1 || r < 1 || c >= cols - 1 || r >= rows - 1) continue;
            if (used.has(k) || seen.has(k)) continue;
            seen.add(k);
            opts.push({ c, r });
          }
        }
        if (!opts.length) break;
        const add = pick(opts);
        used.add(key(add.c, add.r));
        out.push(add);
      }
      return out;
    }

    function touches(h, c, r, cols, rows, value) {
      for (const [dc, dr] of NBS) {
        const nc = c + dc;
        const nr = r + dr;
        if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
        if (h[nr][nc] === value) return true;
      }
      return false;
    }

    function growPlateau(h, cols, rows, value, count, forbid, allowed) {
      const seeds = [];
      for (let r = 2; r < rows - 2; r++) {
        for (let c = 2; c < cols - 2; c++) {
          if (allowed && !allowed.has(key(c, r))) continue;
          if (h[r][c] !== 0) continue;
          if (forbid != null && touches(h, c, r, cols, rows, forbid)) continue;
          seeds.push({ c, r });
        }
      }
      if (!seeds.length) return;
      let best = [];
      let bestD = -1;
      for (const s of seeds) {
        let d = 99;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (h[r][c] === 0) continue;
            const md = Math.abs(s.c - c) + Math.abs(s.r - r);
            if (md < d) d = md;
          }
        }
        if (d > bestD) {
          bestD = d;
          best = [s];
        } else if (d === bestD) best.push(s);
      }
      const start = pick(best.length ? best : seeds);
      const frontier = [start];
      const used = new Set([key(start.c, start.r)]);
      h[start.r][start.c] = value;
      let painted = 1;
      while (frontier.length && painted < count) {
        const idx = (Math.random() * frontier.length) | 0;
        const cur = frontier[idx];
        const opts = NBS
          .map(([dc, dr]) => ({ c: cur.c + dc, r: cur.r + dr }))
          .filter((p) => p.c >= 1 && p.r >= 1 && p.c < cols - 1 && p.r < rows - 1)
          .filter((p) => !used.has(key(p.c, p.r)))
          .filter((p) => !allowed || allowed.has(key(p.c, p.r)))
          .filter((p) => h[p.r][p.c] === 0)
          .filter((p) => forbid == null || !touches(h, p.c, p.r, cols, rows, forbid));
        if (!opts.length) {
          frontier.splice(idx, 1);
          continue;
        }
        const next = pick(opts);
        used.add(key(next.c, next.r));
        h[next.r][next.c] = value;
        painted += 1;
        frontier.push(next);
      }
    }

    /* 邻格只允许差 0 或 ±1。+1 与 -1 相贴时改成中间的 0，避免单向拉平整张图。 */
    function clampAdjacent(h, cols, rows) {
      const conflicts = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (h[r][c] > 1) h[r][c] = 1;
          if (h[r][c] < -1) h[r][c] = -1;
          if (h[r][c] === 1 && touches(h, c, r, cols, rows, -1)) conflicts.push([c, r]);
          if (h[r][c] === -1 && touches(h, c, r, cols, rows, 1)) conflicts.push([c, r]);
        }
      }
      for (const [c, r] of conflicts) h[r][c] = 0;
      let changed = true;
      let guard = 0;
      while (changed && guard++ < cols * rows) {
        changed = false;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            for (const [dc, dr] of NBS) {
              const nc = c + dc;
              const nr = r + dr;
              if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
              const d = h[r][c] - h[nr][nc];
              if (d > 1 || d < -1) {
                h[r][c] = 0;
                changed = true;
              }
            }
          }
        }
      }
    }

    function buildHeights(cols, rows, allowed, hills, basins) {
      const h = [];
      for (let r = 0; r < rows; r++) {
        h[r] = [];
        for (let c = 0; c < cols; c++) h[r][c] = 0;
      }
      for (let i = 0; i < hills; i++) {
        growPlateau(h, cols, rows, 1, 6 + ((Math.random() * 10) | 0), -1, allowed);
      }
      for (let i = 0; i < basins; i++) {
        growPlateau(h, cols, rows, -1, 5 + ((Math.random() * 8) | 0), 1, allowed);
      }
      clampAdjacent(h, cols, rows);
      return h;
    }

    function placeIsland(cols, rows) {
      const seed = { c: ((cols * 0.5) | 0), r: ((rows * 0.5) | 0) };
      const radius = 3;
      const core = filledDiamond(cols, rows, seed, radius);
      const cells = growConnectedRim(core, cols, rows, (Math.random() * 4) | 0);
      return { id: "home", theme: "forest", cells, hills: 1, basins: 1 };
    }

    function dressIsland(isle, cols, rows, cells) {
      const theme = THEME;
      const allowed = new Set(isle.cells.map((p) => key(p.c, p.r)));
      const avoid = new Set();
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!allowed.has(key(c, r))) avoid.add(key(c, r));
        }
      }
      const landAt = (c, r) => {
        const k = key(c, r);
        if (!cells.has(k)) {
          cells.set(k, {
            c, r, island: isle.id, theme: isle.theme,
            base: theme.land(), feat: null, layer: "land", h: 0,
          });
        }
        return cells.get(k);
      };
      for (const p of isle.cells) landAt(p.c, p.r);
      const heights = buildHeights(cols, rows, allowed, isle.hills, isle.basins);
      const reserved = new Set(avoid);
      if (theme.water) {
        const river = walkPrefer(
          Math.max(3, (isle.cells.length / 8) | 0),
          cols, rows, reserved,
          (c, r) => (heights[r][c] === -1 ? 2 : heights[r][c] === 0 ? 1 : 0)
        );
        const waterCells = expandBlob(river, 1 + ((Math.random() * 3) | 0), cols, rows, reserved, (c, r) => allowed.has(key(c, r)) && heights[r][c] <= 0);
        for (const p of waterCells) {
          const cell = landAt(p.c, p.r);
          cell.base = WATER;
          cell.layer = "water";
          cell.feat = null;
          reserved.add(key(p.c, p.r));
          heights[p.r][p.c] = Math.min(heights[p.r][p.c], 0);
        }
      }
      if (theme.ridge) {
        const ridge = walkPrefer(Math.min(5, Math.max(2, (isle.cells.length / 16) | 0)), cols, rows, reserved, (c, r) => (heights[r][c] === 1 ? 2 : 0))
          .filter((p, i, arr) => {
            if (i === 0) return true;
            const prev = arr[i - 1];
            return Math.abs(p.c - prev.c) + Math.abs(p.r - prev.r) === 1;
          });
        ridge.forEach((p, i) => {
          const cell = landAt(p.c, p.r);
          cell.base = ROCK;
          cell.layer = "ridge";
          reserved.add(key(p.c, p.r));
          heights[p.r][p.c] = 1;
          if (ridge.length === 1) cell.feat = MTN.peak;
          else if (i === 0) cell.feat = MTN.endL;
          else if (i === ridge.length - 1) cell.feat = MTN.endR;
          else cell.feat = MTN.mid;
        });
      }
      clampAdjacent(heights, cols, rows);
      for (const p of isle.cells) {
        const cell = landAt(p.c, p.r);
        cell.h = heights[p.r][p.c];
        if (cell.layer === "land" && Math.random() < theme.feat) cell.feat = pick(FEATURES);
      }
    }

    function plan(cols, rows) {
      const isle = placeIsland(cols, rows);
      const cells = new Map();
      dressIsland(isle, cols, rows, cells);
      return { grid: [...cells.values()], islands: [isle] };
    }

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const images = {};
    const geom = {};
    const allSrc = [
      ...LAND, ROCK, WATER, SHROUD,
      ...FEATURES.map((f) => f.src),
      MTN.peak.src, MTN.mid.src, MTN.endL.src, MTN.endR.src,
      HERO,
    ];

    let world = null;
    let fog = createFog();
    let player = { c: 0, r: 0 };
    let walk = { active: false, path: [], from: null, to: null, t: 1 };
    let heading = 0;
    let spin = { active: false, dir: 0, t: 0 };
    let spinQueue = 0;
    let lastTick = 0;
    let hoveredKey = "";
    let hintPulse = 0;
    const xrayLayer = { c: null, g: null };
    const occLayer = { c: null, g: null };
    const tintLayer = { c: null, g: null };
    const edgeLayer = { c: null, g: null };

    function placePlayer(grid, cols, rows) {
      const cx = (cols / 2) | 0;
      const cy = (rows / 2) | 0;
      const ranked = grid
        .filter((cell) => cell.layer === "land" && cell.island === "home")
        .slice()
        .sort((a, b) => (Math.abs(a.c - cx) + Math.abs(a.r - cy)) - (Math.abs(b.c - cx) + Math.abs(b.r - cy)));
      const start = ranked[0] || grid[0];
      player = { c: start.c, r: start.r };
      walk = { active: false, path: [], from: null, to: null, t: 1 };
      heading = 0;
      spin = { active: false, dir: 0, t: 0 };
      spinQueue = 0;
    }

    function resetWorld() {
      const { cols, rows } = fitGrid(canvas.clientWidth || 1200, canvas.clientHeight || 700);
      const planned = plan(cols, rows);
      world = {
        grid: planned.grid,
        islands: planned.islands,
        cols,
        rows,
        lookup: new Map(planned.grid.map((cell) => [cellKey(cell.c, cell.r), cell])),
      };
      fog = createFog();
      placePlayer(planned.grid, cols, rows);
      const here = world.lookup.get(cellKey(player.c, player.r));
      if (here) remember(fog, here);
    }

    async function boot() {
      await Promise.all(allSrc.map(async (src) => { images[src] = await load(src); }));
      for (const src of [...LAND, ROCK, WATER, SHROUD]) geom[src] = measure(images[src]);
      resetWorld();
      draw();
    }

    function wxz(c, r) {
      return { x: (c - r) / 2, z: (c + r) / 2 };
    }

    function islandPivot() {
      let sc = 0;
      let sr = 0;
      for (const cell of world.grid) {
        sc += cell.c;
        sr += cell.r;
      }
      const n = world.grid.length || 1;
      return wxz(sc / n, sr / n);
    }

    function easeIsland(t) {
      return 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));
    }

    function easeLocal(t) {
      const a = 0.4;
      const b = 0.6;
      if (t <= a) return 0;
      if (t >= b) return 1;
      return 0.5 - 0.5 * Math.cos(Math.PI * ((t - a) / (b - a)));
    }

    function currentAngles() {
      const base = heading * Math.PI / 4;
      if (!spin.active) return { island: base, local: base };
      const step = spin.dir * (Math.PI / 4);
      return {
        island: base + step * easeIsland(spin.t),
        local: base + step * easeLocal(spin.t),
      };
    }

    function rotateAround(x, z, px, pz, ang) {
      const d = x - px;
      const e = z - pz;
      const c = Math.cos(ang);
      const s = Math.sin(ang);
      return { x: px + d * c - e * s, z: pz + d * s + e * c };
    }

    function project(x, y, z, ox, oy) {
      return {
        x: ox + x * TILE_W,
        y: oy + z * TILE_H - y * STEP,
        depth: z,
      };
    }

    function cellCenter(c, r, h, ox, oy) {
      const { island } = currentAngles();
      const p = islandPivot();
      const w = wxz(c, r);
      const rxz = rotateAround(w.x, w.z, p.x, p.z, island);
      const out = project(rxz.x, h || 0, rxz.z, ox, oy);
      out.depth = rxz.z;
      return out;
    }

    function iso(c, r, h, ox, oy) {
      return cellCenter(c, r, h, ox, oy);
    }

    function localCorners(ang) {
      const raw = [[0.5, 0], [0, 0.5], [-0.5, 0], [0, -0.5]];
      const c = Math.cos(ang);
      const s = Math.sin(ang);
      return raw.map(([x, z]) => ({ x: x * c - z * s, z: x * s + z * c }));
    }

    function slabGeometry(cell, ox, oy) {
      const { island, local } = currentAngles();
      const p = islandPivot();
      const w = wxz(cell.c, cell.r);
      const cen = rotateAround(w.x, w.z, p.x, p.z, island);
      const h = cell.h || 0;
      const top = [];
      const bot = [];
      for (const off of localCorners(local)) {
        top.push(project(cen.x + off.x, h, cen.z + off.z, ox, oy));
        bot.push(project(cen.x + off.x, h - SLAB, cen.z + off.z, ox, oy));
      }
      return { top, bot, cen, depth: cen.z + h * 0.02 };
    }

    function sideColors(src) {
      if (src === WATER) return ["#24525c", "#163840"];
      if (src === ROCK) return ["#4a4640", "#2e2c28"];
      if (src === SHROUD) return ["#3c3e44", "#26282c"];
      return ["#5a3f2c", "#3a281c"];
    }

    function faceSign(a, b, c) {
      return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    }

    function affineImage(img, s0, s1, s2, d0, d1, d2) {
      const a11 = s1.x - s0.x;
      const a12 = s2.x - s0.x;
      const a21 = s1.y - s0.y;
      const a22 = s2.y - s0.y;
      const det = a11 * a22 - a12 * a21;
      if (Math.abs(det) < 1e-4) return;
      const inv = 1 / det;
      const b11 = d1.x - d0.x;
      const b12 = d2.x - d0.x;
      const b21 = d1.y - d0.y;
      const b22 = d2.y - d0.y;
      const A = (b11 * a22 - b12 * a21) * inv;
      const C = (a11 * b12 - a12 * b11) * inv;
      const B = (b21 * a22 - b22 * a21) * inv;
      const D = (a11 * b22 - a12 * b21) * inv;
      const E = d0.x - A * s0.x - C * s0.y;
      const F = d0.y - B * s0.x - D * s0.y;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(d0.x, d0.y);
      ctx.lineTo(d1.x, d1.y);
      ctx.lineTo(d2.x, d2.y);
      ctx.closePath();
      ctx.clip();
      ctx.transform(A, B, C, D, E, F);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

    function srcDiamond(img, src) {
      const g = geom[src];
      const midX = img.width / 2;
      const eq = g ? g.eqY : img.height * REF_EQ;
      const halfW = (g ? g.contentW : img.width) / 2;
      const halfH = halfW * FACE_H_RATIO;
      return [
        { x: midX, y: eq - halfH },
        { x: midX + halfW, y: eq },
        { x: midX, y: eq + halfH },
        { x: midX - halfW, y: eq },
      ];
    }

    function expandTri(a, b, c, px) {
      const cx = (a.x + b.x + c.x) / 3;
      const cy = (a.y + b.y + c.y) / 3;
      const out = (p) => {
        const dx = p.x - cx;
        const dy = p.y - cy;
        const len = Math.hypot(dx, dy) || 1;
        return { x: p.x + (dx / len) * px, y: p.y + (dy / len) * px };
      };
      return [out(a), out(b), out(c)];
    }

    function drawTopTexture(img, src, top) {
      const s = srcDiamond(img, src);
      const a = expandTri(top[0], top[1], top[2], 1.4);
      const b = expandTri(top[0], top[2], top[3], 1.4);
      affineImage(img, s[0], s[1], s[2], a[0], a[1], a[2]);
      affineImage(img, s[0], s[2], s[3], b[0], b[1], b[2]);
    }

    function drawSlab(cell, ox, oy, src) {
      const img = images[src || cell.base];
      const { top, bot } = slabGeometry(cell, ox, oy);
      const tones = sideColors(src || cell.base);
      const prevFilter = ctx.filter;
      ctx.filter = "none";
      const faces = [];
      for (let i = 0; i < 4; i++) {
        const n = (i + 1) % 4;
        const area = faceSign(top[i], top[n], bot[n]);
        if (Math.abs(area) < 0.8) continue;
        faces.push({
          i,
          n,
          area,
          depth: ((top[i].depth || 0) + (top[n].depth || 0)) * 0.5,
        });
      }
      faces.sort((a, b) => a.depth - b.depth);
      for (const face of faces) {
        ctx.beginPath();
        if (face.area > 0) {
          ctx.moveTo(top[face.i].x, top[face.i].y);
          ctx.lineTo(top[face.n].x, top[face.n].y);
          ctx.lineTo(bot[face.n].x, bot[face.n].y);
          ctx.lineTo(bot[face.i].x, bot[face.i].y);
        } else {
          ctx.moveTo(top[face.n].x, top[face.n].y);
          ctx.lineTo(top[face.i].x, top[face.i].y);
          ctx.lineTo(bot[face.i].x, bot[face.i].y);
          ctx.lineTo(bot[face.n].x, bot[face.n].y);
        }
        ctx.closePath();
        ctx.fillStyle = tones[face.i % 2];
        ctx.fill();
      }
      ctx.beginPath();
      ctx.moveTo(top[0].x, top[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(top[i].x, top[i].y);
      ctx.closePath();
      ctx.fillStyle = (src || cell.base) === SHROUD ? "#c5c8ce" : tones[0];
      ctx.fill();
      ctx.filter = prevFilter;
      if (img) drawTopTexture(img, src || cell.base, top);
      ctx.filter = "none";
      ctx.beginPath();
      ctx.moveTo(top[0].x, top[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(top[i].x, top[i].y);
      ctx.closePath();
      ctx.strokeStyle = tones[1];
      ctx.lineJoin = "round";
      ctx.lineWidth = 1.25;
      ctx.stroke();
      ctx.filter = prevFilter;
    }

    function hoverPulse() {
      return 0.5 + 0.5 * Math.sin(hintPulse * 2.8);
    }

    function fitLayer(layer, w, h) {
      if (!layer.c || layer.c.width !== w || layer.c.height !== h) {
        layer.c = document.createElement("canvas");
        layer.c.width = w;
        layer.c.height = h;
        layer.g = layer.c.getContext("2d");
      }
      layer.g.setTransform(1, 0, 0, 1, 0, 0);
      layer.g.globalAlpha = 1;
      layer.g.globalCompositeOperation = "source-over";
      layer.g.filter = "none";
      layer.g.clearRect(0, 0, w, h);
      return layer.g;
    }

    function fillSlabBody(g, cell, ox, oy, topFill, sideA, sideB) {
      const { top, bot } = slabGeometry(cell, ox, oy);
      const faces = [];
      for (let i = 0; i < 4; i++) {
        const n = (i + 1) % 4;
        const area = faceSign(top[i], top[n], bot[n]);
        if (Math.abs(area) < 0.8) continue;
        faces.push({
          i,
          n,
          area,
          depth: ((top[i].depth || 0) + (top[n].depth || 0)) * 0.5,
        });
      }
      faces.sort((a, b) => a.depth - b.depth);
      for (const face of faces) {
        g.beginPath();
        if (face.area > 0) {
          g.moveTo(top[face.i].x, top[face.i].y);
          g.lineTo(top[face.n].x, top[face.n].y);
          g.lineTo(bot[face.n].x, bot[face.n].y);
          g.lineTo(bot[face.i].x, bot[face.i].y);
        } else {
          g.moveTo(top[face.n].x, top[face.n].y);
          g.lineTo(top[face.i].x, top[face.i].y);
          g.lineTo(bot[face.i].x, bot[face.i].y);
          g.lineTo(bot[face.n].x, bot[face.n].y);
        }
        g.closePath();
        g.fillStyle = face.i % 2 ? sideB : sideA;
        g.fill();
      }
      g.beginPath();
      g.moveTo(top[0].x, top[0].y);
      for (let i = 1; i < 4; i++) g.lineTo(top[i].x, top[i].y);
      g.closePath();
      g.fillStyle = topFill;
      g.fill();
    }

    function paintFeatOn(g, cell, ox, oy) {
      if (!cell.feat) return;
      const feat = images[cell.feat.src];
      if (!feat) return;
      const p = iso(cell.c, cell.r, cell.h, ox, oy);
      const fw = TILE_W * cell.feat.w;
      const fh = fw * (feat.height / feat.width);
      g.drawImage(feat, p.x - fw / 2, p.y - fh + TILE_H * 0.42, fw, fh);
    }

    function paintCellMask(g, cell, ox, oy, withFeat) {
      fillSlabBody(g, cell, ox, oy, "#fff", "#fff", "#fff");
      if (withFeat) paintFeatOn(g, cell, ox, oy);
    }

    function outlineFromMask(g, mask, stroke, width) {
      const w = g.canvas.width;
      const h = g.canvas.height;
      const eg = fitLayer(edgeLayer, w, h);
      const steps = 16;
      for (let i = 0; i < steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        eg.drawImage(mask, Math.cos(t) * width, Math.sin(t) * width);
      }
      eg.globalCompositeOperation = "destination-out";
      eg.drawImage(mask, 0, 0);
      eg.globalCompositeOperation = "source-in";
      eg.fillStyle = stroke;
      eg.fillRect(0, 0, w, h);
      g.drawImage(edgeLayer.c, 0, 0);
    }

    function paintPlayerOn(g, pose) {
      const art = images[HERO];
      if (!art || !pose) return;
      const dh = HERO_H;
      const dw = dh * (art.width / art.height);
      g.drawImage(art, pose.x - dw / 2, pose.y - dh + 8, dw, dh);
    }

    function drawHoverXray(cell, ox, oy, order, pose, featKeys) {
      const w = Math.max(1, canvas.clientWidth);
      const h = Math.max(1, canvas.clientHeight);
      const hoverK = cellKey(cell.c, cell.r);
      const hoverDepth = slabGeometry(cell, ox, oy).depth;
      const occ = fitLayer(occLayer, w, h);
      let passed = false;
      for (const other of order) {
        if (cellKey(other.c, other.r) === hoverK) {
          passed = true;
          continue;
        }
        if (!passed) continue;
        fillSlabBody(occ, other, ox, oy, "#fff", "#fff", "#fff");
        if (featKeys.has(cellKey(other.c, other.r))) paintFeatOn(occ, other, ox, oy);
      }
      if (playerSortDepth(ox, oy) > hoverDepth + 0.001) paintPlayerOn(occ, pose);

      const stroke = canVisit(cell) ? XRAY_STROKE_OK : XRAY_STROKE_NO;
      const pulse = hoverPulse();
      const glow = `brightness(${0.88 + pulse * 0.28})`;

      const hasFeat = featKeys.has(hoverK);
      const xg = fitLayer(xrayLayer, w, h);
      fillSlabBody(xg, cell, ox, oy, XRAY_TOP, XRAY_SIDE_A, XRAY_SIDE_B);
      if (hasFeat) {
        const tg = fitLayer(tintLayer, w, h);
        paintFeatOn(tg, cell, ox, oy);
        tg.globalCompositeOperation = "source-in";
        tg.fillStyle = XRAY_TOP;
        tg.fillRect(0, 0, w, h);
        xg.drawImage(tintLayer.c, 0, 0);
      }
      xg.globalCompositeOperation = "destination-in";
      xg.drawImage(occLayer.c, 0, 0);
      xg.globalCompositeOperation = "source-over";
      ctx.save();
      ctx.filter = glow;
      ctx.drawImage(xrayLayer.c, 0, 0);
      ctx.restore();

      const mg = fitLayer(tintLayer, w, h);
      paintCellMask(mg, cell, ox, oy, hasFeat);
      const eg = fitLayer(xrayLayer, w, h);
      outlineFromMask(eg, tintLayer.c, stroke, 2.4);
      ctx.save();
      ctx.filter = glow;
      ctx.drawImage(xrayLayer.c, 0, 0);
      ctx.restore();
    }

    function drawFeat(cell, ox, oy) {
      if (!cell.feat) return;
      const p = iso(cell.c, cell.r, cell.h, ox, oy);
      const feat = images[cell.feat.src];
      const fw = TILE_W * cell.feat.w;
      const fh = fw * (feat.height / feat.width);
      ctx.drawImage(feat, p.x - fw / 2, p.y - fh + TILE_H * 0.42, fw, fh);
    }

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - ((-2 * t + 2) ** 2) / 2;
    }

    function avatarPose(ox, oy) {
      if (walk.active && walk.from && walk.to && walk.t < 1) {
        const u = easeInOut(Math.min(1, Math.max(0, walk.t)));
        const c = walk.from.c + (walk.to.c - walk.from.c) * u;
        const r = walk.from.r + (walk.to.r - walk.from.r) * u;
        const h = walk.from.h + (walk.to.h - walk.from.h) * u;
        const p = iso(c, r, h, ox, oy);
        p.y -= Math.sin(u * Math.PI) * 4;
        return p;
      }
      const here = world.lookup.get(cellKey(player.c, player.r));
      return iso(player.c, player.r, here ? here.h : 0, ox, oy);
    }

    function playerSortDepth(ox, oy) {
      if (walk.active && walk.from && walk.to && walk.t < 1) {
        const u = easeInOut(Math.min(1, Math.max(0, walk.t)));
        const a = world.lookup.get(cellKey(walk.from.c, walk.from.r));
        const b = world.lookup.get(cellKey(walk.to.c, walk.to.r));
        const da = a ? slabGeometry(a, ox, oy).depth : 0;
        const db = b ? slabGeometry(b, ox, oy).depth : da;
        return da + (db - da) * u;
      }
      const here = world.lookup.get(cellKey(player.c, player.r));
      return here ? slabGeometry(here, ox, oy).depth : 0;
    }

    function drawPlayer(ox, oy, pose) {
      const art = images[HERO];
      if (!art) return;
      const p = pose || avatarPose(ox, oy);
      const dh = HERO_H;
      const dw = dh * (art.width / art.height);
      ctx.save();
      ctx.fillStyle = "rgba(20, 14, 8, 0.3)";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + 3, 11, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(art, p.x - dw / 2, p.y - dh + 8, dw, dh);
      ctx.restore();
    }

    function pickCell(mx, my, ox, oy) {
      const cx = mx - ox;
      const cy = my - oy;
      const c = Math.round((cx / (TILE_W / 2) + cy / (TILE_H / 2)) / 2);
      const r = Math.round((cy / (TILE_H / 2) - cx / (TILE_W / 2)) / 2);
      return world.lookup.get(cellKey(c, r)) || null;
    }

    function inTri(mx, my, a, b, c) {
      const s1 = faceSign(a, b, { x: mx, y: my });
      const s2 = faceSign(b, c, { x: mx, y: my });
      const s3 = faceSign(c, a, { x: mx, y: my });
      const hasNeg = s1 < 0 || s2 < 0 || s3 < 0;
      const hasPos = s1 > 0 || s2 > 0 || s3 > 0;
      return !(hasNeg && hasPos);
    }

    function pickCellAt(mx, my, ox, oy, pred) {
      let best = null;
      let bestDepth = -1e9;
      for (const cell of world.grid) {
        if (pred && !pred(cell)) continue;
        const { top, depth } = slabGeometry(cell, ox, oy);
        if (!inTri(mx, my, top[0], top[1], top[2]) && !inTri(mx, my, top[0], top[2], top[3])) continue;
        if (depth >= bestDepth) {
          bestDepth = depth;
          best = cell;
        }
      }
      return best;
    }

    function pickTarget(mx, my, ox, oy) {
      return pickCellAt(mx, my, ox, oy, canVisit);
    }

    function pickHover(mx, my, ox, oy) {
      return pickCellAt(mx, my, ox, oy, null);
    }

    function reachableFrontier() {
      const out = [];
      for (const cell of world.grid) {
        const k = cellKey(cell.c, cell.r);
        if (fog.explored.has(k)) continue;
        if (isAdjacentToSet(cell.c, cell.r, fog.explored)) out.push(cell);
      }
      return out;
    }

    function canVisit(cell) {
      if (!cell) return false;
      const k = cellKey(cell.c, cell.r);
      if (fog.explored.has(k)) return true;
      return isAdjacentToSet(cell.c, cell.r, fog.explored);
    }

    function findPath(dest) {
      if (!canVisit(dest)) return null;
      const startK = cellKey(player.c, player.r);
      const destK = cellKey(dest.c, dest.r);
      if (startK === destK) return [];
      const q = [{ c: player.c, r: player.r }];
      const prev = new Map([[startK, null]]);
      const passable = (c, r) => {
        const k = cellKey(c, r);
        if (!world.lookup.has(k)) return false;
        if (fog.explored.has(k)) return true;
        return k === destK;
      };
      for (let i = 0; i < q.length; i++) {
        const cur = q[i];
        for (const [dc, dr] of NBS) {
          const n = { c: cur.c + dc, r: cur.r + dr };
          const k = cellKey(n.c, n.r);
          if (prev.has(k) || !passable(n.c, n.r)) continue;
          prev.set(k, cur);
          if (k === destK) {
            const path = [n];
            let p = cur;
            while (p && cellKey(p.c, p.r) !== startK) {
              path.push(p);
              p = prev.get(cellKey(p.c, p.r));
            }
            return path.reverse();
          }
          q.push(n);
        }
      }
      return null;
    }

    function beginStep() {
      const next = walk.path.shift();
      if (!next) {
        walk.active = false;
        walk.to = null;
        return;
      }
      const here = world.lookup.get(cellKey(player.c, player.r));
      const dest = world.lookup.get(cellKey(next.c, next.r));
      walk.from = { c: player.c, r: player.r, h: here ? here.h : 0 };
      walk.to = { c: next.c, r: next.r, h: dest ? dest.h : 0 };
      walk.t = 0;
    }

    function finishStep() {
      player = { c: walk.to.c, r: walk.to.r };
      const cell = world.lookup.get(cellKey(player.c, player.r));
      if (cell) remember(fog, cell);
      if (walk.path.length) beginStep();
      else {
        walk.active = false;
        walk.to = null;
      }
    }

    function goTo(dest) {
      const path = findPath(dest);
      if (!path || !path.length) return;
      walk.path = path;
      walk.active = true;
      beginStep();
    }

    function fogBlink(cell) {
      const hot = hoveredKey === cellKey(cell.c, cell.r);
      const t = 0.5 + 0.5 * Math.sin(hintPulse * 2.8);
      return { hot, flash: t * t };
    }

    function origin() {
      const sample = world.grid;
      let sc = 0;
      let sr = 0;
      for (const cell of sample) {
        sc += cell.c;
        sr += cell.r;
      }
      const n = sample.length || 1;
      const cc = sc / n;
      const cr = sr / n;
      return {
        ox: canvas.clientWidth / 2 - (cc - cr) * (TILE_W / 2),
        oy: canvas.clientHeight * 0.36 - (cc + cr) * (TILE_H / 2) + STEP,
      };
    }

    function ensureCanvas() {
      const dpr = devicePixelRatio || 1;
      const w = Math.max(1, canvas.clientWidth);
      const h = Math.max(1, canvas.clientHeight);
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
    }

    function draw() {
      if (!world) return;
      ensureCanvas();
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      const { ox, oy } = origin();
      const here = world.lookup.get(cellKey(player.c, player.r));
      const sight = computeSight(world.lookup, player, world.cols, world.rows);
      const radius = here ? visionRadius(here) : 2;
      const order = world.grid.slice().sort((a, b) => {
        const da = slabGeometry(a, ox, oy).depth;
        const db = slabGeometry(b, ox, oy).depth;
        return da - db || a.h - b.h || a.c - b.c;
      });
      const frontierKeys = new Set(reachableFrontier().map((cell) => cellKey(cell.c, cell.r)));
      const pose = avatarPose(ox, oy);
      const playerDepth = playerSortDepth(ox, oy);
      const featKeys = new Set();
      const pulse = hoverPulse();
      const vis = [];

      for (const cell of order) {
        const k = cellKey(cell.c, cell.r);
        const lv = levelOf(cell.c, cell.r, fog, sight);
        const dist = Math.abs(cell.c - player.c) + Math.abs(cell.r - player.r);
        const style = fogStyle(lv, dist, radius, isAdjacentToSet(cell.c, cell.r, sight));
        if (!style.draw) continue;
        const hovering = k === hoveredKey;
        const go = frontierKeys.has(k);
        const { hot, flash } = go ? fogBlink(cell) : { hot: false, flash: 0 };
        let bright = go ? 0.68 + flash * (hot ? 0.7 : 0.52) + (hot ? 0.1 : 0) : style.bright;
        let sat = go ? 0.3 + flash * 0.25 : style.sat;
        if (hovering) {
          bright = Math.min(1.42, (go ? 0.9 : style.bright) + 0.12 + pulse * 0.48);
          sat = Math.max(sat, 0.65);
        }
        vis.push({
          cell,
          k,
          style,
          go,
          hot,
          flash,
          hovering,
          bright,
          sat,
          depth: slabGeometry(cell, ox, oy).depth,
        });
      }

      for (const item of vis) {
        ctx.save();
        ctx.filter = `brightness(${item.bright}) saturate(${item.sat})`;
        drawSlab(item.cell, ox, oy, item.style.shroud ? SHROUD : item.cell.base);
        if (item.go && item.flash > 0.12 && !item.hovering) {
          ctx.globalAlpha = item.flash * (item.hot ? 0.5 : 0.34);
          ctx.filter = `brightness(${1.25 + item.flash * 0.4}) saturate(0.6)`;
          drawSlab(item.cell, ox, oy, SHROUD);
        }
        ctx.restore();
      }
      for (const item of vis) {
        if (!item.style.feat || item.depth > playerDepth + 0.001) continue;
        ctx.save();
        ctx.filter = `brightness(${item.bright}) saturate(${item.sat})`;
        drawFeat(item.cell, ox, oy);
        ctx.restore();
        featKeys.add(item.k);
      }
      drawPlayer(ox, oy, pose);
      for (const item of vis) {
        if (!item.style.feat || item.depth <= playerDepth + 0.001) continue;
        ctx.save();
        ctx.filter = `brightness(${item.bright}) saturate(${item.sat})`;
        drawFeat(item.cell, ox, oy);
        ctx.restore();
        featKeys.add(item.k);
      }
      if (hoveredKey) {
        const hoverCell = world.lookup.get(hoveredKey);
        if (hoverCell) drawHoverXray(hoverCell, ox, oy, order, pose, featKeys);
      }
    }

    function reroll() {
      resetWorld();
      draw();
    }

    document.getElementById("reroll").onclick = () => {
      walk.active = false;
      walk.path = [];
      spin.active = false;
      spinQueue = 0;
      reroll();
    };
    canvas.addEventListener("click", (ev) => {
      if (!world || walk.active || spin.active) return;
      const rect = canvas.getBoundingClientRect();
      const { ox, oy } = origin();
      const cell = pickTarget(ev.clientX - rect.left, ev.clientY - rect.top, ox, oy);
      if (!cell) return;
      goTo(cell);
    });
    canvas.addEventListener("mousemove", (ev) => {
      if (!world) return;
      const rect = canvas.getBoundingClientRect();
      const { ox, oy } = origin();
      const cell = pickHover(ev.clientX - rect.left, ev.clientY - rect.top, ox, oy);
      const next = cell ? cellKey(cell.c, cell.r) : "";
      canvas.style.cursor = cell ? "pointer" : "default";
      if (next === hoveredKey) return;
      hoveredKey = next;
    });
    canvas.addEventListener("mouseleave", () => {
      hoveredKey = "";
    });
    function startSpin(dir) {
      if (!world || walk.active) return;
      if (spin.active) {
        if (spin.dir === dir) spinQueue = dir;
        return;
      }
      spin = { active: true, dir, t: 0 };
      spinQueue = 0;
    }

    addEventListener("keydown", (ev) => {
      const left = ev.key === "ArrowLeft" || ev.key === "a" || ev.key === "A";
      const right = ev.key === "ArrowRight" || ev.key === "d" || ev.key === "D";
      if (!left && !right) return;
      ev.preventDefault();
      startSpin(left ? 1 : -1);
    });
    addEventListener("resize", () => draw());
    function stepWalk(now) {
      hintPulse = now / 1000;
      const dt = lastTick ? Math.min(48, now - lastTick) : 16;
      lastTick = now;
      if (walk.active && walk.to) {
        walk.t += dt / STEP_MS;
        if (walk.t >= 1) {
          const extra = walk.t - 1;
          finishStep();
          if (walk.active) walk.t = extra;
        }
      }
      if (spin.active) {
        spin.t += dt / SPIN_MS;
        if (spin.t >= 1) {
          heading = ((heading + spin.dir) % 8 + 8) % 8;
          const queued = spinQueue;
          spin = { active: false, dir: 0, t: 0 };
          spinQueue = 0;
          if (queued) startSpin(queued);
        }
      }
    }

    function tick(now) {
      stepWalk(now);
      if (world) draw();
      requestAnimationFrame(tick);
    }
    boot()
      .then(() => {
        requestAnimationFrame(tick);
        setInterval(() => {
          stepWalk(performance.now());
          if (world) draw();
        }, 33);
      })
      .catch((e) => { document.querySelector(".hint").textContent = "加载失败: " + e; });
  </script>
</body>
</html>
